<meta name="apple-mobile-web-app-title" content="6flt Clients">
<script>
// v1.2 : sur iPhone, l'app installee a sa propre memoire, separee de Safari, et demarre sur le start_url du manifest.
// On donne donc a iOS un manifest qui porte les seances deja ouvertes, pour les retrouver dans l'app installee.
// Si iOS n'utilise pas ce manifest, il reprend l'adresse de la page, qui contient aussi les seances (?b=).
window.__c6Manifest = function(){
  try{
    var base = location.origin + location.pathname.replace(/[^\/]*$/, '');
    var ua = navigator.userAgent || '';
    var ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    var toks = [];
    var m = location.search.match(/[?&]b=([^&#]+)/);
    if(m) decodeURIComponent(m[1]).split(',').forEach(function(t){ t = t.trim(); if(t && toks.indexOf(t) < 0) toks.push(t); });
    try{ (JSON.parse(localStorage.getItem('6fltc_tokens') || '[]') || []).forEach(function(x){ if(x && x.token && toks.indexOf(x.token) < 0) toks.push(x.token); }); }catch(e2){}
    toks = toks.filter(function(t){ return /^[A-Za-z0-9_-]{6,64}$/.test(t); }).slice(0, 20);
    var href = 'manifest.json?v=1.0';
    if(ios && !standalone && toks.length){
      var man = {name:'6flt Clients', short_name:'6flt Clients', description:'Suivez vos séances photo avec 6flt Photographies',
        start_url: base + '?b=' + toks.join(','), scope: base, display:'standalone', orientation:'portrait',
        background_color:'#0e0f11', theme_color:'#0e0f11',
        icons:[{src: base + 'icon-192.png?v=1.0', sizes:'192x192', type:'image/png'}, {src: base + 'icon-512.png?v=1.0', sizes:'512x512', type:'image/png'}]};
      href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
    }
    var link = document.querySelector('link[rel="manifest"]');
    if(!link){ link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
    link.href = href;
  }catch(e){}
};
window.__c6Manifest();
</script>

<style>
:root{--bg:#0e0f11;--surface:#16181c;--surface2:#1e2126;--border:#2a2d35;--accent:#e8571a;--accent2:#f0a070;--text:#f0ede8;--muted:#7a7d85}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
a{color:inherit}

/* ---- chrome liste ---- */
#topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
#topbar h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
#topbar h1 span{color:var(--accent)}
#btn-add{background:var(--accent);color:#fff;border:none;border-radius:10px;width:36px;height:36px;font-size:22px;line-height:1;cursor:pointer;flex-shrink:0}
#view-list{padding:14px 16px 60px;max-width:560px;margin:0 auto}
.banner{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px;line-height:1.4}
.banner b{display:block;color:var(--text);font-size:13.5px;margin-bottom:2px}
.banner button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap}
.banner.col{display:block}
.push-err{display:block;margin-top:5px;color:#f29b9b;font-size:12px;line-height:1.35}
.banner details{margin-top:8px}
.banner summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13px;list-style:none;padding:4px 0}
.banner summary::-webkit-details-marker{display:none}
.banner ol{margin:6px 0 2px;padding-left:20px;color:var(--text);font-size:13.5px;line-height:1.75}
.banner .ic{display:inline-flex;vertical-align:-3px;color:#3b8cff}
#cv-install .banner{margin:0 0 14px}
/* v1.2.2 : carte d'installation visible + guide plein ecran */
.inst-card{background:rgba(232,87,26,.1);border:1px solid rgba(232,87,26,.55);border-radius:16px;padding:14px;margin:0 0 16px}
.inst-top{display:flex;gap:12px;align-items:center}
.inst-top img{width:46px;height:46px;border-radius:11px;flex:none}
.inst-top b{display:block;font-size:15.5px;color:#fff;margin-bottom:3px}
.inst-top span{display:block;font-size:13px;color:#c9c7c0;line-height:1.45}
.inst-btn{display:block;width:100%;margin-top:12px;background:#fff;color:#111;border:none;border-radius:11px;padding:13px;font:700 15px 'Inter',sans-serif;cursor:pointer}
#inst-sheet{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.74);display:flex;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 12px calc(64px + env(safe-area-inset-bottom))}
#inst-sheet.at-top{align-items:flex-start}
#inst-sheet.at-bottom{align-items:flex-end;padding-top:calc(64px + env(safe-area-inset-top));padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.inst-box{background:#1c1d21;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px 16px 16px;width:100%;max-width:520px;color:#f3f2ee;font-family:'Inter',sans-serif}
.inst-box h3{margin:0 0 4px;font-size:19px;font-weight:800}
.inst-kicker{margin:0 0 4px;color:#9be0b1;font-weight:700;font-size:13px}
.inst-sub{margin:0;color:#a5a49d;font-size:13.5px;line-height:1.45}
.inst-steps{list-style:none;margin:12px 0 14px;padding:0;counter-reset:st}
.inst-steps li{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid rgba(255,255,255,.07);font-size:15px;line-height:1.4}
.inst-steps li::before{counter-increment:st;content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.inst-chip{display:inline-flex;align-items:center;gap:6px;background:#2c2c2e;color:#fff;border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.inst-chip svg{color:#0a84ff;flex:none}
.inst-chip.round{border-radius:50%;width:36px;height:36px;justify-content:center;padding:0;font-size:15px;letter-spacing:1px}
.inst-chip.blue{color:#0a84ff}
.inst-close{display:block;width:100%;margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,.18);color:#f3f2ee;border-radius:11px;padding:12px;font:600 14px 'Inter',sans-serif;cursor:pointer}
.inst-arrow{position:fixed;z-index:301;color:var(--accent);pointer-events:none;animation:instDown 1s ease-in-out infinite}
.inst-arrow svg{display:block;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 3px 8px rgba(0,0,0,.7))}
.inst-arrow.br{right:10px;bottom:calc(2px + env(safe-area-inset-bottom))}
.inst-arrow.bc{left:50%;margin-left:-32px;bottom:calc(2px + env(safe-area-inset-bottom))}
.inst-note{flex-basis:100%;padding-left:36px;font-size:12.5px;color:#8e8d88;line-height:1.3}
.inst-appic{width:20px;height:20px;border-radius:5px}
.inst-arrow.tr{right:12px;top:calc(4px + env(safe-area-inset-top));animation-name:instUp}
.inst-arrow.tr svg{transform:rotate(180deg)}
@keyframes instDown{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
@keyframes instUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 40px 14px 14px;margin-bottom:12px;cursor:pointer;position:relative}
.card:active{border-color:var(--accent)}
.card b{display:block;font-size:15px;margin-bottom:4px}
.card .sub{font-size:13px;color:var(--muted)}
.badge{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge.ok{background:#1f3a2a;color:#9be0b1}
.badge.wait{background:#3a2f1f;color:#f2c98b}
.badge.tbd{background:#2a2333;color:#c9a8f2}
.badge.gone{background:#3a1f1f;color:#f29b9b}
.card .rm{position:absolute;top:12px;right:8px;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:6px}
.empty{text-align:center;padding:70px 20px;color:var(--muted);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

/* ---- modal ajout ---- */
#modal-add{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#modal-add .sheet{background:var(--surface);border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px}
#modal-add h2{margin:0 0 4px;font-size:16px}
#modal-add p.hint{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
#modal-add input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;padding:12px;margin-bottom:8px}
#modal-add .err{color:#f29b9b;font-size:12.5px;margin:0 0 10px;min-height:1em}
#modal-add .row{display:flex;gap:8px}
#modal-add button{flex:1;border-radius:10px;padding:13px;font-size:14px;font-weight:700;border:none;cursor:pointer}
#modal-add .go{background:var(--accent);color:#fff}
#modal-add .go[disabled]{opacity:.5}
#modal-add .cancel{background:var(--surface2);color:var(--text)}

/* ---- doc partage : rendu du document Spoties (v1.5.1 : feuille de style complete, reprise de Spoties v1.55) ---- */
/* document client */
.bf-doc{--d-bg:#0e0f11;--d-panel:#17181b;--d-line:rgba(255,255,255,.09);--d-text:#f3f2ee;--d-dim:#a5a49d;--d-mute:#6f6f69;--d-accent:#e8571a;--car:#e8571a;--gold:#f2a93b;--dusk:#4a6fa0;--blue:#5b4b9e;
  position:relative;background:var(--d-bg);color:var(--d-text);border:1px solid var(--border);border-radius:12px;padding:42px 40px 34px;font-family:'Inter',sans-serif}
.bf-doc.bf-print{--d-bg:#ffffff;--d-panel:#f4f3ef;--d-line:rgba(0,0,0,.1);--d-text:#141414;--d-dim:#55544f;--d-mute:#8b8a84;--d-accent:#c9480f;border-radius:3px;border-color:#fff;box-shadow:0 14px 50px rgba(0,0,0,.55);padding:34px 48px 40px}
.bf-row{position:relative;display:grid;gap:26px;align-items:start}
.bf-row[data-layout="1"]{grid-template-columns:minmax(0,1fr)}
.bf-row[data-layout="1-1"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.bf-row[data-layout="1-1-1"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.bf-row[data-layout="2-1"]{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.bf-row[data-layout="1-2"]{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.bf-m-phone .bf-row{grid-template-columns:minmax(0,1fr)!important;gap:22px}
.bf-slot{min-width:0;position:relative}
.bf-m-phone .bf-empty,.bf-m-a4 .bf-empty,.bf-m-phone .bf-void,.bf-m-a4 .bf-void,.bf-m-phone .bf-eo,.bf-m-a4 .bf-eo,.bf-m-desk .bf-empty,.bf-m-desk .bf-void,.bf-m-desk .bf-eo{display:none!important}
.bf-blk{position:relative;min-width:0;border-radius:6px}
.bf-m-phone .bf-addrow,.bf-m-a4 .bf-addrow,.bf-m-desk .bf-addrow{display:none}
/* blocs */
.bf-h{font-size:18px;font-weight:700;margin:0 0 14px;letter-spacing:-.005em;color:var(--d-text)}
.bf-cover-top{display:flex;justify-content:space-between;gap:12px;font-family:'Space Mono',monospace;font-size:12px}
.bf-cover-top .bf-kick{color:var(--d-accent)}
.bf-cover-top .bf-dos{color:var(--d-mute);margin-left:auto}
.bf-cover-main{display:flex;gap:22px;align-items:center;margin-top:22px}
.bf-cav{width:86px;height:86px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;color:#fff;box-shadow:0 0 0 3px var(--d-bg),0 0 0 5px var(--car);overflow:hidden;background:var(--d-panel)}
.bf-cav img,.bf-cphoto img{width:100%;height:100%;object-fit:cover;display:block}
.bf-cover h1{font-size:clamp(24px,3.2vw,34px);line-height:1.1;margin:0 0 10px;letter-spacing:-.012em;font-weight:700;color:var(--d-text)}
.bf-cover p{margin:0;color:var(--d-dim);font-size:14.5px;line-height:1.55;max-width:52ch}
.bf-carbar{display:flex;align-items:center;gap:12px;margin-top:26px}
.bf-carbar i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--car),var(--car) 70%,transparent)}
.bf-carbar span{font-size:12px;color:var(--d-mute);white-space:nowrap}
.bf-m-phone .bf-cover-main{flex-direction:column;align-items:flex-start;gap:16px}
.bf-facts{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px 14px;margin:0}
.bf-facts dt{font-size:12px;color:var(--d-mute);font-family:'Space Mono',monospace;padding-top:1px}
.bf-facts dd{margin:0;font-size:14px;line-height:1.45;color:var(--d-text)}
.bf-dbtn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:10px 16px;background:var(--d-accent);color:#fff!important;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none}
.bf-wx{margin-top:14px;padding:11px 13px;background:var(--d-panel);border:1px solid var(--d-line);border-radius:9px;font-size:13px;color:var(--d-dim);line-height:1.45}
.bf-client{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.bf-cphoto{width:62px;height:62px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;overflow:hidden}
.bf-cname{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--d-text)}
.bf-ccar{font-size:13px;color:var(--d-dim);display:flex;align-items:center;gap:7px;line-height:1.35;margin-top:2px}
.bf-sw{width:12px;height:12px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px var(--d-line)}
.bf-map{background:var(--d-panel);border:1px solid var(--d-line);border-radius:12px;overflow:hidden;position:relative}
.bf-map img{display:block;width:100%;aspect-ratio:960/440;object-fit:cover;background:var(--d-panel)}
.bf-map.err img{display:none}
.bf-map.err::after{content:"Carte indisponible, vérifie ta connexion";display:block;padding:40px 10px;text-align:center;color:var(--d-mute);font-size:13px}
.bf-mapcap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--d-dim)}
.bf-muted{padding:30px 10px;text-align:center;color:var(--d-mute);font-size:13px}
.bf-spot{display:grid;grid-template-columns:64px minmax(0,1fr);gap:13px;padding:13px 0;border-top:1px solid var(--d-line)}
.bf-spot:last-child{border-bottom:1px solid var(--d-line)}
.bf-simg{position:relative;width:64px;height:64px;border-radius:9px;overflow:hidden;background:var(--d-panel)}
.bf-simg img{width:100%;height:100%;object-fit:cover;display:block}
.bf-simg .bf-noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--d-mute)}
.bf-simg .bf-noimg svg{width:22px;height:22px}
.bf-simg b{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--d-accent);color:#fff;font-size:11px;font-family:'Space Mono',monospace;display:flex;align-items:center;justify-content:center}
.bf-sname{font-size:14px;font-weight:600;margin:0 0 3px;color:var(--d-text)}
.bf-snote{font-size:13px;color:var(--d-dim);margin:0 0 8px;line-height:1.45;white-space:pre-line}
.bf-tags{display:flex;gap:6px;flex-wrap:wrap}
.bf-tags span{font-size:11px;color:var(--d-dim);border:1px solid var(--d-line);padding:2px 8px;border-radius:999px}
.bf-sdist{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--d-mute);margin:7px 0 0}
.bf-tlhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bf-tlhead .bf-h{margin:0}
.bf-sun{font-size:11.5px;color:var(--d-dim);border:1px solid var(--d-line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.bf-tline{position:relative;padding-left:24px}
.bf-tline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;border-radius:2px;background:linear-gradient(to bottom,var(--gold),var(--d-accent) 60%,var(--dusk) 85%,var(--blue))}
.bf-tl{position:relative;padding-bottom:18px}
.bf-tl:last-child{padding-bottom:0}
.bf-tl::before{content:"";position:absolute;left:-24px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--d-bg);border:2px solid var(--d-accent);box-sizing:border-box}
.bf-tlt{font-family:'Space Mono',monospace;font-size:12.5px;color:var(--d-accent);margin:0 0 2px}
.bf-tl h3{font-size:14px;margin:0 0 3px;font-weight:600;color:var(--d-text)}
.bf-tl p.bf-tld{font-size:12.5px;color:var(--d-dim);margin:0;line-height:1.45}
.bf-trip{font-size:11px;color:var(--d-mute);margin:-8px 0 12px;font-family:'Space Mono',monospace}
.bf-check{list-style:none;margin:0;padding:0}
.bf-check li{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--d-line);font-size:14px;line-height:1.45;color:var(--d-text)}
.bf-check li:last-child{border-bottom:1px solid var(--d-line)}
.bf-check li::before{content:"";flex:0 0 auto;width:9px;height:9px;margin-top:6px;border:1.5px solid var(--d-accent);border-radius:2px}
.bf-photos{display:grid;gap:8px}
.bf-photos[data-l="1"]{grid-template-columns:1fr}
.bf-photos[data-l="2"]{grid-template-columns:1fr 1fr}
.bf-photos[data-l="3"],.bf-photos[data-l="m"]{grid-template-columns:repeat(3,1fr)}
.bf-photos img{width:100%;display:block;object-fit:cover;border-radius:8px;aspect-ratio:4/3;background:var(--d-panel)}
.bf-photos[data-l="1"] img{aspect-ratio:16/9}
.bf-photos[data-l="3"] img,.bf-photos[data-l="m"] img{aspect-ratio:1/1}
.bf-photos[data-l="m"] img:first-child{grid-column:span 2;grid-row:span 2;height:100%}
.bf-pdrop{border:1.5px dashed var(--d-line);border-radius:10px;padding:30px 12px;text-align:center;color:var(--d-mute);font-size:13px;line-height:1.5}
.bf-pcap{font-size:12.5px;color:var(--d-mute);margin:9px 0 0}
/* textes modifiables dans les blocs */
.bf-et{outline:none;white-space:pre-wrap}
.bf-bnote{display:block;margin:12px 0 0;font-size:13px;color:var(--d-dim);line-height:1.5}
.bf-m-phone .bf-et:empty,.bf-m-a4 .bf-et:empty,.bf-m-desk .bf-et:empty{display:none!important}
.bf-txt{outline:none;font-size:14.5px;line-height:1.6;color:var(--d-dim);min-height:1.6em;white-space:pre-wrap}
.bf-txt:empty::before{content:attr(data-ph);color:var(--d-mute)}
.bf-m-phone .bf-txt:empty,.bf-m-a4 .bf-txt:empty,.bf-m-desk .bf-txt:empty{display:none}
.bf-txt.h{font-size:20px;font-weight:700;color:var(--d-text);line-height:1.25}

  var ios = isIOS(), android = /android/i.test(ua);
  var inapp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|Snapchat|TikTok|musical_ly|BytedanceWebview|Line\//i.test(ua);
  var otherIOS = /CriOS|FxiOS|EdgiOS/i.test(ua);
  var sv = +((ua.match(/Version\/(\d+)/) || [])[1] || 0);
  return {ios:ios, android:android, inapp:inapp, otherIOS:otherIOS, safari26:ios && !otherIOS && !inapp && sv >= 26};
}

function urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var raw = window.atob(base64), out = new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}
// v1.2.3 : l'activation dit ce qui bloque, et reprend si l'abonnement n'est pas arrive au serveur
var PUSH_STATE = {busy:false, need:false, ok:false, err:''};
function swReady(ms){
  return Promise.race([navigator.serviceWorker.ready, new Promise(function(res, rej){ setTimeout(function(){ rej(new Error('Le service de l\'app ne démarre pas, ferme et rouvre l\'app')); }, ms || 8000); })]);
}
function registerAllTokens(sub){
  if(!sb) return Promise.reject(new Error('Connexion au serveur indisponible'));
  var raw = sub.toJSON(), tokens = loadTokens();
  if(!raw || !raw.endpoint || !raw.keys) return Promise.reject(new Error('Abonnement incomplet'));
  return Promise.all(tokens.map(function(t){
    return sb.rpc('client_register_push', {p_token:t.token, p_endpoint:raw.endpoint, p_p256dh:raw.keys.p256dh, p_auth:raw.keys.auth, p_ua:navigator.userAgent}).then(function(r){
      if(r.error) throw new Error('Serveur : '+(r.error.message || 'erreur'));
      return r.data;
    });
  }));
}
function notifBannerHTML(){
  if(!('Notification' in window)) return '';
  if(PUSH_STATE.busy) return '<div class="banner"><div><b>Activation en cours…</b>Quelques secondes.</div></div>';
  if(Notification.permission==='denied') return '<div class="banner"><div><b>Notifications désactivées</b>Réactive-les dans Réglages, Notifications, 6flt Clients.</div></div>';
  if(Notification.permission==='granted' && !PUSH_STATE.need)
    return PUSH_STATE.ok ? '<div class="banner"><div><b>Notifications activées</b>Une notification de test vient de partir.</div></div>' : '';
  var err = PUSH_STATE.err ? '<span class="push-err">'+e(PUSH_STATE.err)+'</span>' : '';
  var title = Notification.permission==='granted' ? 'Termine l\'activation' : 'Dernière étape';
  return '<div class="banner"><div><b>'+title+'</b>Active les notifications pour être prévenu de chaque étape de ta séance.'+err+'</div><button class="js-enable-notif" type="button">'+(PUSH_STATE.err ? 'Réessayer' : 'Activer')+'</button></div>';
}
function enableNotifications(){
  if(!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)){
    PUSH_STATE.need = true; PUSH_STATE.err = 'Notifications indisponibles ici : ouvre l\'app depuis son icône.'; refreshHelpers(); return;
  }
  // la demande part directement du toucher, sinon iOS la refuse
  var pr;
  try{ pr = Notification.requestPermission(); }catch(x){ pr = Promise.reject(x); }
  PUSH_STATE.busy = true; PUSH_STATE.err = ''; refreshHelpers();
  Promise.resolve(pr).then(function(perm){
    if(perm!=='granted') throw new Error(perm==='denied' ? 'Autorisation refusée' : 'Autorisation non accordée');
    return swReady(8000);
  }).then(function(reg){
    return reg.pushManager.getSubscription().then(function(s0){
      return s0 || reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});
    });
  }).then(registerAllTokens).then(function(){
    PUSH_STATE.busy = false; PUSH_STATE.need = false; PUSH_STATE.ok = true; PUSH_STATE.err = ''; refreshHelpers();
    var first = loadTokens()[0];
    if(first && sb) sb.rpc('client_test_notify', {p_token:first.token}).then(function(){}, function(){});
  }).catch(function(err){
    PUSH_STATE.busy = false; PUSH_STATE.need = true; PUSH_STATE.err = (err && err.message) || String(err); refreshHelpers();
  });
}
// a chaque ouverture de l'app installee : l'abonnement est renvoye au serveur, ou redemande s'il manque
function pushSync(){
  if(!isStandalone() || !('Notification' in window) || Notification.permission!=='granted' || !('serviceWorker' in navigator)) return;
  swReady(8000).then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(sub){
    if(!sub){ PUSH_STATE.need = true; refreshHelpers(); return; }
    return registerAllTokens(sub);
  }).catch(function(err){ PUSH_STATE.need = true; PUSH_STATE.err = (err && err.message) || ''; refreshHelpers(); });
}
function registerTokenForExistingPush(tok){
  if(!('Notification' in window) || Notification.permission!=='granted' || !('serviceWorker' in navigator) || !sb) return;
  navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(sub){
    if(!sub) return;
    var raw = sub.toJSON();
    return sb.rpc('client_register_push', {p_token:tok, p_endpoint:raw.endpoint, p_p256dh:raw.keys.p256dh, p_auth:raw.keys.auth, p_ua:navigator.userAgent});
  }).catch(function(err){ console.warn(err); });
}

var CARD_CACHE = {};
function renderList(){
  var root = document.getElementById('view-list');
  var tokens = loadTokens();
  var h = helperBannerHTML();
  if(!tokens.length){
    h += '<div class="empty"><b>Aucune séance</b>Touche le + pour ajouter le lien reçu de ton photographe.</div>';
    root.innerHTML = h;
    bindListEvents();
    return;
  }
  h += tokens.map(function(t){
    var c = CARD_CACHE[t.token];
    if(!c) return '<div class="card" data-tok="'+e(t.token)+'"><b>Chargement…</b><button class="rm" type="button" data-rm="'+e(t.token)+'">✕</button></div>';
    if(c.error) return '<div class="card" data-tok="'+e(t.token)+'"><b>Séance introuvable</b><span class="sub">Ce lien n\'est plus valide</span><button class="rm" type="button" data-rm="'+e(t.token)+'">✕</button></div>';
    var d = c.data || {}, badge = 'wait', label = 'En attente';
    if(c.gallery_url){ badge = 'ok'; label = 'Galerie prête'; }
    else if(c.confirmed_at){ badge = 'ok'; label = 'Confirmée'; }
    else if(d.tbd){ badge = 'tbd'; label = 'Date à fixer'; }
    var sub = d.start ? fdt(d.start, {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}) : (d.tbd ? 'Date à définir' : '');
    return '<div class="card" data-tok="'+e(t.token)+'"><b>'+e(c.title || d.title || 'Briefing')+'</b>'+(sub ? '<span class="sub">'+e(sub)+'</span>' : '')+
      '<div><span class="badge '+badge+'">'+e(label)+'</span></div>'+
      '<button class="rm" type="button" data-rm="'+e(t.token)+'">✕</button></div>';
  }).join('');
  root.innerHTML = h;
  bindListEvents();
  tokens.forEach(function(t){ if(!CARD_CACHE[t.token]) loadCardData(t.token); });
}
function loadCardData(tok){
  if(!sb) return;
  // v1.2 : les cartes lisent sans compter une ouverture (seule l'ouverture d'une seance compte)
  sb.rpc('peek_shared_brief', {p_token:tok}).then(function(r){
    return r.error ? sb.rpc('get_shared_brief', {p_token:tok}) : r;
  }).then(function(r){
    if(r.error || !r.data || r.data.error){ CARD_CACHE[tok] = {error:true}; renderList(); return; }
    CARD_CACHE[tok] = r.data; renderList();
  }, function(){ /* pas de reseau : on retentera au prochain rendu */ });
}
function bindListEvents(){
  var root = document.getElementById('view-list');
  root.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('click', function(ev){
      if(ev.target && ev.target.hasAttribute('data-rm')) return;
      openDetail(card.getAttribute('data-tok'));
    });
  });
  root.querySelectorAll('[data-rm]').forEach(function(btn){
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      removeTokenFromStore(btn.getAttribute('data-rm'));
      syncUrl();
      renderList();
    });
  });
}

function decode(str){ var i=0,lat=0,lng=0,out=[]; while(i<str.length){ var b,sh=0,res=0; do{ b=str.charCodeAt(i++)-63; res|=(b&31)<<sh; sh+=5; }while(b>=32); lat+=(res&1)?~(res>>1):(res>>1); sh=0; res=0; do{ b=str.charCodeAt(i++)-63; res|=(b&31)<<sh; sh+=5; }while(b>=32); lng+=(res&1)?~(res>>1):(res>>1); out.push([lng/1e5, lat/1e5]); } return out; }
function circle(lng, lat, r){ var pts=[]; for(var k=0;k<=48;k++){ var a=k/48*Math.PI*2; pts.push([lng+r*Math.sin(a)/(111320*Math.cos(lat*Math.PI/180)), lat+r*Math.cos(a)/111320]); } return pts; }
function icsDate(iso){ return iso.replace(/[-:]/g, '').replace(/\.\d+/, ''); }
function icsTx(s){ return String(s||'').replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n'); }
function ics(d){
  var loc = d.revealed ? (d.place || '') : 'Lieu communiqué avant la séance';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//6flt Photographies//Briefing//FR','BEGIN:VEVENT','UID:'+DETAIL_TOK+'@6flt','DTSTAMP:'+icsDate(new Date().toISOString()),
    'DTSTART:'+icsDate(d.start),'DTEND:'+icsDate(d.end),'SUMMARY:'+icsTx('Shooting photo 6flt'),'LOCATION:'+icsTx(loc),'DESCRIPTION:'+icsTx((d.tone==='vous' ? 'Votre' : 'Ton')+' briefing'),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Shooting 6flt','TRIGGER:-PT3H','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function navUrl(sp){
  if(!sp || !sp.length) return '';
  var dest = sp[sp.length-1], wp = sp.slice(0, -1).map(function(s){ return s.lat+','+s.lng; }).join('|');
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+dest.lat+','+dest.lng+(wp ? '&waypoints='+encodeURIComponent(wp) : '');
}
function signedHTML(nm, sg, at){
  var when = at ? new Date(at).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'}) : '';
  return '<div class="bf-signed">'+(sg ? '<img src="'+e(sg)+'" alt="Signature">' : '')+'<span>Signé par <b>'+e(nm)+'</b>'+(when ? ' le '+e(when) : '')+'</span></div>';
}
function glMap(box, d, rev, ac){
  ac = ac || '#e8571a';
  var pts = rev ? (d.spots||[]) : (d.zones||[]); if(!pts.length || !window.mapboxgl) return;
  var fallback = box.innerHTML;
  box.innerHTML = ''; box.className = 'cv-gl';
  try{
    var m = new mapboxgl.Map({container:box, style:'mapbox://styles/mapbox/dark-v11', center:[pts[0].lng, pts[0].lat], zoom:10, attributionControl:false, cooperativeGestures:true});
    DETAIL_MAPS.push(m);
    m.addControl(new mapboxgl.NavigationControl({showCompass:false}), 'top-right');
    var bb = new mapboxgl.LngLatBounds();
    m.on('load', function(){
      if(rev){
        var line = d.geometry ? decode(d.geometry) : (pts.length>1 ? pts.map(function(p){ return [p.lng, p.lat]; }) : null);
        if(line){ m.addSource('cv-route', {type:'geojson', data:{type:'Feature', geometry:{type:'LineString', coordinates:line}}}); m.addLayer({id:'cv-route', type:'line', source:'cv-route', layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':ac,'line-width':4,'line-opacity':.85}}); line.forEach(function(c){ bb.extend(c); }); }
      } else {
        m.addSource('cv-zones', {type:'geojson', data:{type:'FeatureCollection', features:pts.map(function(z){ return {type:'Feature', geometry:{type:'Polygon', coordinates:[circle(z.lng, z.lat, z.r)]}}; })}});
        m.addLayer({id:'cv-zf', type:'fill', source:'cv-zones', paint:{'fill-color':ac,'fill-opacity':.16}});
        m.addLayer({id:'cv-zl', type:'line', source:'cv-zones', paint:{'line-color':ac,'line-width':1.5,'line-dasharray':[2,2]}});
        pts.forEach(function(z){ circle(z.lng, z.lat, z.r).forEach(function(c){ bb.extend(c); }); });
      }
      pts.forEach(function(p){
        var el = document.createElement('div'), inn = document.createElement('div'); inn.className = 'cv-pin'; inn.textContent = p.n; el.appendChild(inn);
        var mk = new mapboxgl.Marker({element:el}).setLngLat([p.lng, p.lat]);
        if(rev && p.name) mk.setPopup(new mapboxgl.Popup({offset:16, closeButton:false}).setHTML('<b style="color:#111">'+e(p.name)+'</b><br><a href="https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng+'" target="_blank" rel="noopener">Y aller</a>'));
        mk.addTo(m); bb.extend([p.lng, p.lat]);
      });
      if(!bb.isEmpty()) m.fitBounds(bb, {padding:40, maxZoom:14, duration:0});
    });
    m.on('error', function(ev){ console.warn('carte', ev && ev.error); });
  }catch(err){ console.warn(err); box.className = 'bf-map'; box.innerHTML = fallback; }
}
/* v1.5 : proposition de date. Etat lu sur le serveur (en attente, refusee), l'appareil sert de repli hors ligne.
   v1.6 : le bouton du bas ouvre directement un calendrier ; moment de la journee au lieu d'une heure ; jour refuse barre.
   v1.7 : heures calculees pour chaque moment (lumiere du jour choisi + duree du briefing), jusqu'a 3 dates en un envoi
   v1.8 : un creneau refuse ne bloque que ce moment du jour (PROP_BLOCKED) ; proposition modifiable tant que le photographe n'a pas repondu */
var PROP_DECLINED = [], PROP_BLOCKED = [], PROP_PENDING = [], PROP_TV = function(a){ return a; };

    var galH = '<div class="cv-gal"><a class="btn" href="'+e(D.gallery_url)+'" target="_blank" rel="noopener">'+tv('Voir ma galerie', 'Voir ma galerie')+'</a>';
    if(D.review_submitted_at){
      galH += '<p class="cv-prop-note">'+tv('Merci pour ton avis !', 'Merci pour votre avis !')+'</p>';
    } else {
      galH += '<label class="cv-sl">'+tv('Une note pour le photographe ?', 'Une note pour le photographe ?')+'</label>'+
        '<div class="cv-stars" id="cv-stars">'+[1,2,3,4,5].map(function(n){ return '<button type="button" class="cv-star" data-n="'+n+'">★</button>'; }).join('')+'</div>'+
        '<textarea id="cv-review-text" rows="2" placeholder="'+tv('Un commentaire (optionnel)', 'Un commentaire (optionnel)')+'"></textarea>'+
        '<label class="cv-pub"><input type="checkbox" id="cv-review-pub"> '+tv('J\'accepte que mon avis soit publié (Instagram, site de 6flt)', 'J\'accepte que mon avis soit publié (Instagram, site de 6flt)')+'</label>'+
        '<button type="button" id="cv-review-go" class="cv-prop-btn" disabled style="margin-top:8px;background:var(--d-accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer">'+tv('Envoyer', 'Envoyer')+'</button>';
    }
    galH += '</div>';
    if(docEl) docEl.insertAdjacentHTML('beforeend', galH);
  }

  var pb = document.getElementById('cv-pdf');
  if(pb) pb.onclick = function(){
    loadPdfLibs().then(function(){
      pb.disabled = true; pb.textContent = 'PDF…';
      var nm = String(d.title || 'Briefing').replace(/[\\/:*?"<>|]+/g, '').trim() || 'Briefing';
      var pdfHtml = D.html;
      if(D.confirmed_at){
        var tmp = document.createElement('div'); tmp.innerHTML = D.html || '';
        var ab = tmp.querySelector('.bf-blk[data-type="accord"]');
        if(ab){ var cbx = ab.querySelector('.bf-ack-cb'); if(cbx) cbx.setAttribute('checked', ''); if(D.signed_name) ab.insertAdjacentHTML('beforeend', signedHTML(D.signed_name, D.signature, D.confirmed_at)); }
        pdfHtml = tmp.innerHTML;
      }
      return Promise.race([bfHtmlPdf(pdfHtml, {car:d.car, accent:d.accent || '', title:nm, file:nm+'.pdf'}), new Promise(function(r, j){ setTimeout(function(){ j(new Error('delai')); }, 30000); })]);
    }).then(function(){ pb.disabled = false; pb.textContent = 'PDF'; },
      function(){ pb.disabled = false; pb.textContent = 'PDF'; alert(tv('Téléchargement impossible sans réseau. Réessaie une fois connecté.', 'Téléchargement impossible sans réseau. Réessayez une fois connecté.')); });
  };

  var cb = document.getElementById('cv-conf');
  var ackCb = root.querySelector('.bf-ack-cb'), needAck = !!ackCb, accBlk = ackCb ? ackCb.closest('.bf-blk') : null;
  if(ackCb && !tbdv && !conf){ ackCb.disabled = false; var ackLb = ackCb.closest('.bf-ack'); if(ackLb) ackLb.style.cursor = 'pointer'; }
  if(ackCb && conf){ ackCb.checked = true; }
  var pad = null, nameIn = null, ink = false;
  if(accBlk && conf && D.signed_name) accBlk.insertAdjacentHTML('beforeend', signedHTML(D.signed_name, D.signature, D.confirmed_at));
  if(accBlk && !conf && !tbdv){
    accBlk.insertAdjacentHTML('beforeend', '<div class="cv-sign"><label class="cv-sl" for="cv-name">'+tv('Ton nom et prénom', 'Vos nom et prénom')+'</label>'+
      '<input id="cv-name" class="cv-name" autocomplete="name" autocapitalize="words" placeholder="Prénom Nom">'+
      '<div class="cv-sl">'+tv('Ta signature', 'Votre signature')+'<button type="button" class="cv-clear">Effacer</button></div>'+
      '<canvas class="cv-pad" aria-label="Zone de signature"></canvas>'+
      '<p class="cv-sh">'+tv('Signe avec le doigt dans le cadre blanc.', 'Signez avec le doigt dans le cadre blanc.')+'</p></div>');
    nameIn = accBlk.querySelector('.cv-name'); pad = accBlk.querySelector('.cv-pad');
    var pctx = null, drawing = false, last = null, dpr = Math.max(1, Math.min(3, window.devicePixelRatio||1));
    var sizePad = function(){
      try{ pctx = pad.getContext('2d'); }catch(ex){ pctx = null; }
      if(!pctx) return;
      var w = pad.clientWidth || 300, hh = 150; pad.width = Math.round(w*dpr); pad.height = Math.round(hh*dpr);
      pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, pad.width, pad.height); pctx.strokeStyle = '#14151a'; pctx.lineWidth = 2.4*dpr; pctx.lineCap = 'round'; pctx.lineJoin = 'round'; ink = false;
    };
    sizePad();
    if(pctx){
      var pt = function(ev){ var b = pad.getBoundingClientRect(); return {x:(ev.clientX-b.left)*dpr, y:(ev.clientY-b.top)*dpr}; };
      pad.addEventListener('pointerdown', function(ev){ if(!pctx) return; ev.preventDefault(); drawing = true; last = pt(ev); try{ pad.setPointerCapture(ev.pointerId); }catch(x){} pctx.beginPath(); pctx.arc(last.x, last.y, pctx.lineWidth/2, 0, Math.PI*2); pctx.fillStyle = '#14151a'; pctx.fill(); });
      pad.addEventListener('pointermove', function(ev){ if(!drawing || !pctx) return; ev.preventDefault(); var p = pt(ev); pctx.beginPath(); pctx.moveTo(last.x, last.y); pctx.lineTo(p.x, p.y); pctx.stroke(); last = p; if(!ink){ ink = true; syncConf(); } });
      var stop = function(){ drawing = false; };
      pad.addEventListener('pointerup', stop); pad.addEventListener('pointercancel', stop); pad.addEventListener('pointerleave', stop);
    }
    var clearBtn = accBlk.querySelector('.cv-clear'); if(clearBtn) clearBtn.onclick = function(){ sizePad(); syncConf(); };
    nameIn.addEventListener('input', function(){ syncConf(); });
  }
  function missing(){
    if(!needAck) return '';
    if(!ackCb.checked) return tv('Coche la case des conditions', 'Cochez la case des conditions');
    if(nameIn && nameIn.value.trim().length < 3) return tv('Écris ton nom et prénom', 'Écrivez vos nom et prénom');
    if(pad && !ink) return tv('Signe dans le cadre blanc', 'Signez dans le cadre blanc');
    return '';
  }
  function syncConf(){
    if(!cb || conf) return;
    var m = missing();
    cb.classList.toggle('cv-wait', !!m);
    cb.title = m;
  }
  if(ackCb) ackCb.addEventListener('change', syncConf);
  syncConf();
  function sigData(){
    if(!pad || !ink) return null;
    try{ var W = Math.min(600, pad.width), H = Math.round(pad.height*W/pad.width), c2 = document.createElement('canvas'); c2.width = W; c2.height = H; var g = c2.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(pad, 0, 0, W, H); return c2.toDataURL('image/png'); }catch(x){ return null; }
  }
  if(cb && !conf) cb.onclick = function(){
    var m = missing();
    if(m){
      if(accBlk && accBlk.scrollIntoView) try{ accBlk.scrollIntoView({behavior:'smooth', block:'center'}); }catch(x){}
      var hint = root.querySelector('.cv-miss'); if(!hint && accBlk){ accBlk.insertAdjacentHTML('beforeend', '<p class="cv-miss"></p>'); hint = root.querySelector('.cv-miss'); }
      if(hint) hint.textContent = m;
      return;
    }
    var nm = nameIn ? nameIn.value.trim() : null, sg = sigData();
    cb.disabled = true;
    var args = {p_token:DETAIL_TOK}; if(nm) args.p_name = nm; if(sg) args.p_sig = sg;
    sb.rpc('confirm_shared_brief', args).then(function(r){
      if(r.error || !r.data){ cb.disabled = false; alert(tv('Confirmation impossible, réessaie dans un instant.', 'Confirmation impossible, réessayez dans un instant.')); return; }
      DETAIL_D.confirmed_at = new Date().toISOString(); DETAIL_D.signed_name = nm; DETAIL_D.signature = sg;
      cb.className = 'cv-main cv-done'; cb.textContent = 'Séance confirmée';
      var alt = root.querySelector('.cv-alt'); if(alt) alt.remove();
      var sgBox = root.querySelector('.cv-sign'); if(sgBox) sgBox.remove();
      var mh = root.querySelector('.cv-miss'); if(mh) mh.remove();
      if(ackCb){ ackCb.disabled = true; }
      if(accBlk && nm) accBlk.insertAdjacentHTML('beforeend', signedHTML(nm, sg, DETAIL_D.confirmed_at));
      if(!isStandalone()) setTimeout(function(){ openInstallSheet(true); }, 700);
    }, function(){ cb.disabled = false; });
  };

  if(tbdv) propInit(tv);

  var starWrap = document.getElementById('cv-stars'), reviewGo = document.getElementById('cv-review-go'), curStars = 0;
  if(starWrap) starWrap.querySelectorAll('.cv-star').forEach(function(btn){
    btn.addEventListener('click', function(){
      curStars = +btn.getAttribute('data-n');
      starWrap.querySelectorAll('.cv-star').forEach(function(s){ s.classList.toggle('on', +s.getAttribute('data-n') <= curStars); });
      if(reviewGo) reviewGo.disabled = false;
    });
  });
  if(reviewGo) reviewGo.onclick = function(){
    if(!curStars){ return; }
    reviewGo.disabled = true;
    var txt = document.getElementById('cv-review-text').value.trim();
    var pub = !!(document.getElementById('cv-review-pub') || {}).checked;
    sb.rpc('submit_shared_review', {p_token:DETAIL_TOK, p_rating:curStars, p_text:txt || null, p_public:pub}).then(function(r){
      if(r.error || !r.data){ reviewGo.disabled = false; alert(tv('Envoi impossible, réessaie.', 'Envoi impossible, réessayez.')); return; }
      DETAIL_D.review_submitted_at = new Date().toISOString(); DETAIL_D.review_rating = curStars;
      renderDetail();
    }, function(){ reviewGo.disabled = false; });
  };

  clearInterval(DETAIL_TICK);
  if(!rev && D.reveal_at && new Date(D.reveal_at).getFullYear()<2900){
    var upd = function(){
      var ms = new Date(D.reveal_at) - Date.now(), el = document.getElementById('cv-count');
      if(ms <= 0){ clearInterval(DETAIL_TICK); loadDetail(); return; }
      var dd = Math.floor(ms/864e5), hh = Math.floor(ms%864e5/36e5), mm = Math.floor(ms%36e5/6e4);
      if(el) el.textContent = (dd ? dd+' j ' : '')+hh+' h '+(mm<10?'0':'')+mm+' min';
    };
    upd(); DETAIL_TICK = setInterval(upd, 20000);
  }
}

/* ===== export PDF (repris tel quel du moteur Spoties, meme rendu) ===== */
var PDF_LIBS = null;
function loadScript(src){ return new Promise(function(res, rej){ var sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); }
function loadPdfLibs(){
  if(window.html2canvas && window.jspdf) return Promise.resolve();
  if(!PDF_LIBS) PDF_LIBS = Promise.all([
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
  ]).catch(function(err){ PDF_LIBS = null; throw err; });
  return PDF_LIBS;
}
function imgToData(im){
  var src = im.getAttribute('src') || '';
  if(!src || src.indexOf('data:')===0) return Promise.resolve();
  return fetch(src, {mode:'cors', cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(function(b){
    return new Promise(function(res){ var fr = new FileReader(); fr.onload = function(){ im.src = fr.result; im.complete ? res() : (im.onload = im.onerror = res); }; fr.onerror = res; fr.readAsDataURL(b); });
  }).catch(function(){});
}
function pdfCapture(cl){
  var imgs = Array.prototype.slice.call(cl.querySelectorAll('img'));
  return Promise.race([
    Promise.all(imgs.map(imgToData)),
    new Promise(function(r){ setTimeout(r, 8000); })
  ]).then(function(){ return (document.fonts && document.fonts.ready) || 0; }).then(function(){
    var scale = 2, top0 = cl.getBoundingClientRect().top;
    var cuts = Array.prototype.slice.call(cl.querySelectorAll('.bf-row')).map(function(r){ var b = r.getBoundingClientRect(); return {t:(b.top-top0)*scale, b:(b.bottom-top0)*scale}; });
    return html2canvas(cl, {scale:scale, useCORS:true, backgroundColor:'#ffffff', logging:false, windowWidth:720, scrollX:0, scrollY:-window.scrollY}).then(function(cv){ return {cv:cv, cuts:cuts}; });
  });
}
function pdfWrite(o, title, file){
  var cv = o.cv, cuts = o.cuts;
  var J = window.jspdf.jsPDF, pdf = new J({unit:'mm', format:'a4', orientation:'portrait', compress:true});
  var mX = 12, mT = 12, mB = 14, wMM = 210 - mX*2, hMM = 297 - mT - mB;
  var pxPerMM = cv.width / wMM, pageH = Math.floor(hMM * pxPerMM);
  var y = 0, first = true, ctx = cv.getContext('2d');
  var gaps = [];
  for(var gi=0; gi<cuts.length-1; gi++){ if(cuts[gi+1].t > cuts[gi].b) gaps.push((cuts[gi].b + cuts[gi+1].t)/2); }
  function blankCut(lo, hi){
    lo = Math.max(0, Math.floor(lo)); hi = Math.min(cv.height, Math.floor(hi)); if(hi - lo < 12) return 0;
    var w = cv.width, data = ctx.getImageData(0, lo, w, hi - lo).data, run = 0, need = 10;
    for(var r = hi - lo - 1; r >= 0; r--){
      var o2 = r*w*4, edges = 0;
      for(var x = 4; x < w*4; x += 8){
        if(Math.abs(data[o2+x]-data[o2+x-4]) + Math.abs(data[o2+x+1]-data[o2+x-3]) + Math.abs(data[o2+x+2]-data[o2+x-2]) > 60){ if(++edges > 8) break; }
      }
      if(edges <= 8){ if(++run >= need) return lo + r + Math.floor(need/2); } else run = 0;
    }
    return 0;
  }
  while(y < cv.height - 2){
    var lim = y + pageH, end;
    if(lim >= cv.height) end = cv.height;
    else {
      var g1 = gaps.filter(function(g){ return g > y + pageH*0.4 && g <= lim - 2; }).pop();
      end = g1 || blankCut(y + pageH*0.4, lim - 2) || gaps.filter(function(g){ return g > y + pageH*0.15 && g <= lim - 2; }).pop() || blankCut(y + pageH*0.1, y + pageH*0.4) || lim;
      end = Math.round(end);
    }
    var hh = Math.max(1, Math.round(end - y));
    var pc = document.createElement('canvas'); pc.width = cv.width; pc.height = hh;
    var g = pc.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, pc.width, hh); g.drawImage(cv, 0, y, cv.width, hh, 0, 0, cv.width, hh);
    if(!first) pdf.addPage(); first = false;
    pdf.addImage(pc.toDataURL('image/jpeg', 0.92), 'JPEG', mX, mT, wMM, hh / pxPerMM);
    y = end;
  }
  pdf.setProperties({title:title, author:'6flt Photographies'});
  pdf.save(file);
}
function bfHtmlPdf(html, o){
  o = o || {};
  var host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:0;top:0;width:720px;z-index:-1;background:#fff;pointer-events:none';
  document.body.appendChild(host);
  return loadPdfLibs().then(function(){
    var cl = document.createElement('div');
    cl.className = 'bf-doc bf-print bf-m-a4';
    if(o.car) cl.style.setProperty('--car', o.car);
    if(o.accent) cl.style.setProperty('--d-accent', o.accent);
    cl.innerHTML = html || '';
    cl.querySelectorAll('.cv-gl').forEach(function(x){ x.remove(); });
    host.appendChild(cl);
    cl.style.cssText += ';border:none;box-shadow:none;border-radius:0;padding:0;width:720px';
    return pdfCapture(cl);
  }).then(function(r){
    pdfWrite(r, o.title || 'Briefing', o.file || 'Briefing 6flt.pdf');
    host.remove();
  }, function(err){ host.remove(); throw err; });
}

/* ===== service worker + notif-go ===== */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(function(err){ console.warn(err); });
  navigator.serviceWorker.addEventListener('message', function(ev){
    if(ev.data && ev.data.type==='notif-go'){
      var o = ''; try{ o = new URL(ev.data.url, location.href).searchParams.get('open') || ''; }catch(x){}
      if(validToken(o) && hasToken(o)){ if(DETAIL_TOK===o) loadDetail(); else openDetail(o); }
      else refreshHelpers();
    }
  });
}

/* ===== demarrage (v1.2) ===== */
function openParam(){ var o = ''; try{ o = new URLSearchParams(location.search).get('open') || ''; }catch(x){} return validToken(o) ? o : ''; }
function hasToken(t){ return loadTokens().some(function(x){ return x.token===t; }); }
(function start(){
  var toks = urlTokens(), openTok = openParam();
  if(isStandalone()){
    // app installee : les seances du lien d'installation sont importees une seule fois,
    // pour qu'une seance retiree de la liste ne revienne pas a chaque lancement
    var imported = loadJSON('6fltc_imported', []), fresh = [];
    if(!Array.isArray(imported)) imported = [];
    toks.forEach(function(t){
      if(imported.indexOf(t) > -1) return;
      imported.push(t);
      if(!loadTokens().some(function(x){ return x.token===t; })){ addTokenToStore(t); fresh.push(t); }
    });
    saveJSON('6fltc_imported', imported);
    if(toks.length || openTok){ try{ history.replaceState(null, '', location.pathname); }catch(ex){} }
    renderList();
    fresh.forEach(registerTokenForExistingPush);
    // v1.2.4 : toucher une notif ouvre directement la seance concernee
    if(openTok && hasToken(openTok)) openDetail(openTok);
    else if(fresh.length===1) openDetail(fresh[0]);
    pushSync();
    return;
  }
  // navigateur : le lien ouvre la seance, la liste et l'adresse gardent toutes les seances
  toks.forEach(addTokenToStore);
  syncUrl();
  renderList();
  if(toks.length===1) openDetail(toks[0]);
  else if(!toks.length && openTok && hasToken(openTok)) openDetail(openTok);
})();
</script>
