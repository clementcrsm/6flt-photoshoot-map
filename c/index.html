<script>
// v1.2 : sur iPhone, l'app installee a sa propre memoire, separee de Safari, et demarre sur le start_url du manifest.
// On donne donc a iOS un manifest qui porte les seances deja ouvertes, pour les retrouver dans l'app installee.
// Si iOS n'utilise pas ce manifest, il reprend l'adresse de la page, qui contient aussi les seances (?b=).
window.__c6Manifest = function(){
  try{
    var base = location.origin + location.pathname.replace(/[^\/]*$/, '');
    var ua = navigator.userAgent || '';
    var ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    var toks = [];
    var m = location.search.match(/[?&]b=([^&#]+)/);
    if(m) decodeURIComponent(m[1]).split(',').forEach(function(t){ t = t.trim(); if(t && toks.indexOf(t) < 0) toks.push(t); });
    try{ (JSON.parse(localStorage.getItem('6fltc_tokens') || '[]') || []).forEach(function(x){ if(x && x.token && toks.indexOf(x.token) < 0) toks.push(x.token); }); }catch(e2){}
    toks = toks.filter(function(t){ return /^[A-Za-z0-9_-]{6,64}$/.test(t); }).slice(0, 20);
    var href = 'manifest.json?v=1.0';
    if(ios && !standalone && toks.length){
      var man = {name:'6flt Clients', short_name:'6flt Clients', description:'Suivez vos séances photo avec 6flt Photographies',
        start_url: base + '?b=' + toks.join(','), scope: base, display:'standalone', orientation:'portrait',
        background_color:'#0e0f11', theme_color:'#0e0f11',
        icons:[{src: base + 'icon-192.png?v=1.0', sizes:'192x192', type:'image/png'}, {src: base + 'icon-512.png?v=1.0', sizes:'512x512', type:'image/png'}]};
      href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
    }
    var link = document.querySelector('link[rel="manifest"]');
    if(!link){ link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
    link.href = href;
  }catch(e){}
};
window.__c6Manifest();
</script>

<style>

body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
a{color:inherit}

/* ---- chrome liste ---- */

#btn-add{background:var(--accent);color:#fff;border:none;border-radius:10px;width:36px;height:36px;font-size:22px;line-height:1;cursor:pointer;flex-shrink:0}
#view-list{padding:14px 16px 60px;max-width:560px;margin:0 auto}
.banner{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px;line-height:1.4}
.banner b{display:block;color:var(--text);font-size:13.5px;margin-bottom:2px}
.banner button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap}
.banner.col{display:block}
.banner details{margin-top:8px}
.banner summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13px;list-style:none;padding:4px 0}
.banner summary::-webkit-details-marker{display:none}
.banner ol{margin:6px 0 2px;padding-left:20px;color:var(--text);font-size:13.5px;line-height:1.75}
.banner .ic{display:inline-flex;vertical-align:-3px;color:#3b8cff}
#cv-install .banner{margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 40px 14px 14px;margin-bottom:12px;cursor:pointer;position:relative}
.card:active{border-color:var(--accent)}
.card b{display:block;font-size:15px;margin-bottom:4px}
.card .sub{font-size:13px;color:var(--muted)}
.badge{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge.ok{background:#1f3a2a;color:#9be0b1}
.badge.wait{background:#3a2f1f;color:#f2c98b}
.badge.tbd{background:#2a2333;color:#c9a8f2}
.badge.gone{background:#3a1f1f;color:#f29b9b}
.card .rm{position:absolute;top:12px;right:8px;background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:6px}
.empty{text-align:center;padding:70px 20px;color:var(--muted);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

/* ---- modal ajout ---- */
#modal-add{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}

#modal-add .err{color:#f29b9b;font-size:12.5px;margin:0 0 10px;min-height:1em}
#modal-add .row{display:flex;gap:8px}
#modal-add button{flex:1;border-radius:10px;padding:13px;font-size:14px;font-weight:700;border:none;cursor:pointer}
#modal-add .go{background:var(--accent);color:#fff}
#modal-add .go[disabled]{opacity:.5}

/* ---- doc partage (copie du rendu Spoties, meme classes) ---- */

.bf-row[data-layout="1-1"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.bf-row[data-layout="1-1-1"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.bf-row[data-layout="2-1"]{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.bf-row[data-layout="1-2"]{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.bf-m-phone .bf-row{grid-template-columns:minmax(0,1fr)!important;gap:22px}
.bf-slot{min-width:0;position:relative}
.bf-m-phone .bf-empty,.bf-m-a4 .bf-empty,.bf-m-phone .bf-void,.bf-m-a4 .bf-void,.bf-m-phone .bf-eo,.bf-m-a4 .bf-eo{display:none!important}
.bf-blk{position:relative;min-width:0;border-radius:6px}
.bf-h{font-size:18px;font-weight:700;margin:0 0 14px;letter-spacing:-.005em;color:var(--d-text)}
.bf-dbtn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:10px 16px;background:var(--d-accent);color:#fff!important;border-radius:8px;font-weight:600;font-size:13px;text-decoration:none}
.bf-map{background:var(--d-panel);border:1px solid var(--d-line);border-radius:12px;overflow:hidden;position:relative}
.bf-map img{display:block;width:100%;aspect-ratio:960/440;object-fit:cover;background:var(--d-panel)}

.bf-map.err::after{content:"Carte indisponible, vérifie ta connexion";display:block;padding:40px 10px;text-align:center;color:var(--d-mute);font-size:13px}
.bf-mapcap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--d-dim)}
.bf-muted{padding:30px 10px;text-align:center;color:var(--d-mute);font-size:13px}
.bf-txt{outline:none;font-size:14.5px;line-height:1.6;color:var(--d-dim);min-height:1.6em;white-space:pre-wrap}
.bf-txt:empty{display:none}
.bf-txt.h{font-size:20px;font-weight:700;color:var(--d-text);line-height:1.25}
.bf-txt.note{background:var(--d-panel);border-left:3px solid var(--d-accent);border-radius:0 9px 9px 0;padding:13px 15px;color:var(--d-text)}
.bf-price{border:1px solid var(--d-line);border-radius:11px;overflow:hidden;margin-bottom:16px}
.bf-price div{display:flex;justify-content:space-between;gap:14px;padding:12px 16px;border-bottom:1px solid var(--d-line);font-size:14px;color:var(--d-text)}
.bf-price div:last-child{border-bottom:none;background:var(--d-panel);font-weight:600}
.bf-price div span:first-child{color:var(--d-dim)}
.bf-price div:last-child span:first-child{color:var(--d-text)}
.bf-ack{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border:1px solid var(--d-line);border-radius:10px;cursor:default}
.bf-ack-cb{width:17px;height:17px;flex:none;margin:1px 0 0;accent-color:var(--d-accent)}
.bf-ack-t{font-size:14px;line-height:1.45;color:var(--d-text)}
.bf-terms{font-size:12.5px;color:var(--d-mute);line-height:1.6;margin:0;padding-left:18px}
.bf-terms li{margin-bottom:4px}
.bf-contact{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:4px}
.bf-cta{display:inline-flex;padding:11px 18px;border:1px solid var(--d-line);border-radius:10px;color:var(--d-text)!important;font-size:13.5px;font-weight:600;text-decoration:none}
.bf-sign{font-size:12px;color:var(--d-mute)}
.bf-lien .bf-ld{font-size:13px;color:var(--d-dim);margin:0 0 4px;line-height:1.5}
.bf-lurl{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--d-mute);margin:8px 0 0;word-break:break-all}
.bf-doc .bf-signed{margin-top:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bf-doc .bf-signed img{max-width:240px;width:60%;height:auto;background:#fff;border-radius:8px;border:1px solid var(--d-line)}
.bf-doc .bf-signed span{font-size:12.5px;color:var(--d-dim)}
.bf-doc .bf-signed b{color:var(--d-text)}

/* ---- vue detail (chrome identique au lien client Spoties) ---- */

#cv-root.open{display:block}
#cv-root .cv-wrap{max-width:560px;margin:0 auto;padding:18px 14px 150px}
#cv-root .cv-back{display:inline-flex;align-items:center;gap:4px;color:#a5a49d;text-decoration:none;font-size:13px;font-weight:600;margin:4px 4px 12px;background:none;border:none;cursor:pointer;padding:0}

#cv-root .cv-sec [disabled]{opacity:.4}
#cv-root .cv-alt{text-align:center;font-size:13.5px;color:#a5a49d;margin:18px 4px 0;line-height:1.5}
#cv-root .cv-alt a{color:#e8571a;text-decoration:underline;text-underline-offset:2px}
#cv-root .cv-msg{text-align:center;padding:90px 20px;color:#a5a49d;font-size:14px;line-height:1.6}

#cv-root .cv-sign{margin-top:14px;display:flex;flex-direction:column;gap:7px}
#cv-root .cv-sl{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--d-dim,#a5a49d)}
#cv-root .cv-name{width:100%;box-sizing:border-box;background:var(--d-panel,#17181b);border:1px solid var(--d-line,rgba(255,255,255,.09));border-radius:10px;color:var(--d-text,#f3f2ee);font:15px 'Inter',sans-serif;padding:11px 12px;margin-bottom:4px}
#cv-root .cv-clear{background:none;border:none;color:var(--cv-accent,#e8571a);font:600 12px 'Inter',sans-serif;cursor:pointer;padding:2px 0}
#cv-root .cv-pad{display:block;width:100%;height:150px;background:#fff;border-radius:10px;touch-action:none;cursor:crosshair}

/* ---- ajouts app clients : proposition de date, galerie/avis ---- */
.cv-prop{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.cv-prop input,.cv-prop textarea{width:100%;box-sizing:border-box;background:var(--d-panel);border:1px solid var(--d-line);border-radius:10px;color:var(--d-text);font:14px 'Inter',sans-serif;padding:10px 12px}
.cv-prop button{align-self:flex-start;background:var(--d-accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer}
.cv-prop button[disabled]{opacity:.5}
.cv-prop-note{font-size:12.5px;color:var(--d-mute);margin-top:4px}
.cv-gal{margin-top:16px;padding-top:16px;border-top:1px solid var(--d-line)}
.cv-gal .btn{display:inline-flex;padding:12px 18px;background:var(--d-accent);color:#fff!important;border-radius:10px;font-weight:700;text-decoration:none;font-size:14px;margin-bottom:14px}
.cv-stars{display:flex;gap:6px;margin-bottom:10px}
.cv-star{font-size:26px;cursor:pointer;color:var(--d-line);background:none;border:none;padding:0;line-height:1}
.cv-star.on{color:#f2a93b}
</style>

<script>

var TOKENS_KEY = '6fltc_tokens';
function loadTokens(){ try{ var l = JSON.parse(localStorage.getItem(TOKENS_KEY) || '[]'); return Array.isArray(l) ? l : []; }catch(e){ return []; } }
function saveTokens(list){ try{ localStorage.setItem(TOKENS_KEY, JSON.stringify(list)); }catch(e){} }
function addTokenToStore(tok){
  var list = loadTokens();
  if(!list.some(function(x){ return x.token===tok; })) list.unshift({token:tok, addedAt:new Date().toISOString()});
  saveTokens(list);
}
function removeTokenFromStore(tok){ saveTokens(loadTokens().filter(function(x){ return x.token!==tok; })); }
function validToken(t){ return /^[A-Za-z0-9_-]{6,64}$/.test(String(t||'')); }
function urlTokens(){
  var out = [];
  try{
    var m = location.search.match(/[?&]b=([^&#]+)/);
    if(m) decodeURIComponent(m[1]).split(',').forEach(function(t){ t = t.trim(); if(validToken(t) && out.indexOf(t) < 0) out.push(t); });
  }catch(e){}
  return out;
}
// dans Safari, l'adresse de la page porte toutes les seances : c'est elle qu'iOS reprend a l'installation
function syncUrl(){
  if(isStandalone()) return;

  var mainBtn = tbdv ? (hd ? '<a class="cv-main" href="https://instagram.com/'+e(hd)+'" target="_blank" rel="noopener">Choisir la date ensemble</a>' : '<button class="cv-main" disabled>Date à fixer ensemble</button>')
    : '<button id="cv-conf" class="cv-main'+(conf ? ' cv-done' : '')+'"'+(conf ? ' disabled' : '')+'>'+e(confLabel)+'</button>';
  h += '<div class="cv-bar">'+mainBtn+
    '<div class="cv-sec">'+
    (rev && d.spots && d.spots.length ? '<a href="'+e(navUrl(d.spots))+'" target="_blank" rel="noopener">Itinéraire</a>' : '<button disabled>Itinéraire'+(rev ? '' : ' bientôt')+'</button>')+
    '<button id="cv-pdf" type="button">PDF</button>'+
    (d.start ? '<a href="data:text/calendar;charset=utf-8,'+encodeURIComponent(ics(Object.assign({revealed:rev}, d)))+'" download="shooting-6flt.ics">Calendrier</a>' : '')+
    (hd ? '<a href="https://instagram.com/'+e(hd)+'" target="_blank" rel="noopener">Écrire</a>' : '')+
    '</div></div>';
  root.innerHTML = h;
  root.querySelectorAll('.bf-blk[data-type="map"] .bf-map').forEach(function(box){ glMap(box, d, rev, ac); });
  var jb = root.querySelector('.bf-blk[data-type="jourj"]'); if(jb) jb.id = 'cv-jourj';

  /* galerie et avis, ajoutes a la fin du document rendu */
  if(d && D.gallery_url){
    var docEl = root.querySelector('.bf-doc');
    var galH = '<div class="cv-gal"><a class="btn" href="'+e(D.gallery_url)+'" target="_blank" rel="noopener">'+tv('Voir ma galerie', 'Voir ma galerie')+'</a>';
    if(D.review_submitted_at){
      galH += '<p class="cv-prop-note">'+tv('Merci pour ton avis !', 'Merci pour votre avis !')+'</p>';
    } else {
      galH += '<label class="cv-sl">'+tv('Une note pour le photographe ?', 'Une note pour le photographe ?')+'</label>'+
        '<div class="cv-stars" id="cv-stars">'+[1,2,3,4,5].map(function(n){ return '<button type="button" class="cv-star" data-n="'+n+'">★</button>'; }).join('')+'</div>'+
        '<textarea id="cv-review-text" rows="2" placeholder="'+tv('Un commentaire (optionnel)', 'Un commentaire (optionnel)')+'"></textarea>'+
        '<button type="button" id="cv-review-go" class="cv-prop-btn" disabled style="margin-top:8px;background:var(--d-accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer">'+tv('Envoyer', 'Envoyer')+'</button>';
    }
    galH += '</div>';
    if(docEl) docEl.insertAdjacentHTML('beforeend', galH);
  }

  var pb = document.getElementById('cv-pdf');
  if(pb) pb.onclick = function(){
    loadPdfLibs().then(function(){
      pb.disabled = true; pb.textContent = 'PDF…';
      var nm = String(d.title || 'Briefing').replace(/[\\/:*?"<>|]+/g, '').trim() || 'Briefing';
      var pdfHtml = D.html;
      if(D.confirmed_at){
        var tmp = document.createElement('div'); tmp.innerHTML = D.html || '';
        var ab = tmp.querySelector('.bf-blk[data-type="accord"]');
        if(ab){ var cbx = ab.querySelector('.bf-ack-cb'); if(cbx) cbx.setAttribute('checked', ''); if(D.signed_name) ab.insertAdjacentHTML('beforeend', signedHTML(D.signed_name, D.signature, D.confirmed_at)); }
        pdfHtml = tmp.innerHTML;
      }
      return Promise.race([bfHtmlPdf(pdfHtml, {car:d.car, accent:d.accent || '', title:nm, file:nm+'.pdf'}), new Promise(function(r, j){ setTimeout(function(){ j(new Error('delai')); }, 30000); })]);
    }).then(function(){ pb.disabled = false; pb.textContent = 'PDF'; },
      function(){ pb.disabled = false; pb.textContent = 'PDF'; alert(tv('Téléchargement impossible sans réseau. Réessaie une fois connecté.', 'Téléchargement impossible sans réseau. Réessayez une fois connecté.')); });
  };

  var cb = document.getElementById('cv-conf');
  var ackCb = root.querySelector('.bf-ack-cb'), needAck = !!ackCb, accBlk = ackCb ? ackCb.closest('.bf-blk') : null;
  if(ackCb && !tbdv && !conf){ ackCb.disabled = false; var ackLb = ackCb.closest('.bf-ack'); if(ackLb) ackLb.style.cursor = 'pointer'; }
  if(ackCb && conf){ ackCb.checked = true; }
  var pad = null, nameIn = null, ink = false;
  if(accBlk && conf && D.signed_name) accBlk.insertAdjacentHTML('beforeend', signedHTML(D.signed_name, D.signature, D.confirmed_at));
  if(accBlk && !conf && !tbdv){
    accBlk.insertAdjacentHTML('beforeend', '<div class="cv-sign"><label class="cv-sl" for="cv-name">'+tv('Ton nom et prénom', 'Vos nom et prénom')+'</label>'+
      '<input id="cv-name" class="cv-name" autocomplete="name" autocapitalize="words" placeholder="Prénom Nom">'+
      '<div class="cv-sl">'+tv('Ta signature', 'Votre signature')+'<button type="button" class="cv-clear">Effacer</button></div>'+
      '<canvas class="cv-pad" aria-label="Zone de signature"></canvas>'+
      '<p class="cv-sh">'+tv('Signe avec le doigt dans le cadre blanc.', 'Signez avec le doigt dans le cadre blanc.')+'</p></div>');
    nameIn = accBlk.querySelector('.cv-name'); pad = accBlk.querySelector('.cv-pad');
    var pctx = null, drawing = false, last = null, dpr = Math.max(1, Math.min(3, window.devicePixelRatio||1));
    var sizePad = function(){
      try{ pctx = pad.getContext('2d'); }catch(ex){ pctx = null; }
      if(!pctx) return;
      var w = pad.clientWidth || 300, hh = 150; pad.width = Math.round(w*dpr); pad.height = Math.round(hh*dpr);
      pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, pad.width, pad.height); pctx.strokeStyle = '#14151a'; pctx.lineWidth = 2.4*dpr; pctx.lineCap = 'round'; pctx.lineJoin = 'round'; ink = false;
    };
    sizePad();
    if(pctx){
      var pt = function(ev){ var b = pad.getBoundingClientRect(); return {x:(ev.clientX-b.left)*dpr, y:(ev.clientY-b.top)*dpr}; };
      pad.addEventListener('pointerdown', function(ev){ if(!pctx) return; ev.preventDefault(); drawing = true; last = pt(ev); try{ pad.setPointerCapture(ev.pointerId); }catch(x){} pctx.beginPath(); pctx.arc(last.x, last.y, pctx.lineWidth/2, 0, Math.PI*2); pctx.fillStyle = '#14151a'; pctx.fill(); });
      pad.addEventListener('pointermove', function(ev){ if(!drawing || !pctx) return; ev.preventDefault(); var p = pt(ev); pctx.beginPath(); pctx.moveTo(last.x, last.y); pctx.lineTo(p.x, p.y); pctx.stroke(); last = p; if(!ink){ ink = true; syncConf(); } });
      var stop = function(){ drawing = false; };
      pad.addEventListener('pointerup', stop); pad.addEventListener('pointercancel', stop); pad.addEventListener('pointerleave', stop);
    }
    var clearBtn = accBlk.querySelector('.cv-clear'); if(clearBtn) clearBtn.onclick = function(){ sizePad(); syncConf(); };
    nameIn.addEventListener('input', function(){ syncConf(); });
  }
  function missing(){
    if(!needAck) return '';
    if(!ackCb.checked) return tv('Coche la case des conditions', 'Cochez la case des conditions');
    if(nameIn && nameIn.value.trim().length < 3) return tv('Écris ton nom et prénom', 'Écrivez vos nom et prénom');
    if(pad && !ink) return tv('Signe dans le cadre blanc', 'Signez dans le cadre blanc');
    return '';
  }
  function syncConf(){
    if(!cb || conf) return;
    var m = missing();
    cb.classList.toggle('cv-wait', !!m);
    cb.title = m;
  }
  if(ackCb) ackCb.addEventListener('change', syncConf);
  syncConf();
  function sigData(){
    if(!pad || !ink) return null;
    try{ var W = Math.min(600, pad.width), H = Math.round(pad.height*W/pad.width), c2 = document.createElement('canvas'); c2.width = W; c2.height = H; var g = c2.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(pad, 0, 0, W, H); return c2.toDataURL('image/png'); }catch(x){ return null; }
  }
  if(cb && !conf) cb.onclick = function(){
    var m = missing();
    if(m){
      if(accBlk && accBlk.scrollIntoView) try{ accBlk.scrollIntoView({behavior:'smooth', block:'center'}); }catch(x){}
      var hint = root.querySelector('.cv-miss'); if(!hint && accBlk){ accBlk.insertAdjacentHTML('beforeend', '<p class="cv-miss"></p>'); hint = root.querySelector('.cv-miss'); }
      if(hint) hint.textContent = m;
      return;
    }
    var nm = nameIn ? nameIn.value.trim() : null, sg = sigData();
    cb.disabled = true;
    var args = {p_token:DETAIL_TOK}; if(nm) args.p_name = nm; if(sg) args.p_sig = sg;
    sb.rpc('confirm_shared_brief', args).then(function(r){
      if(r.error || !r.data){ cb.disabled = false; alert(tv('Confirmation impossible, réessaie dans un instant.', 'Confirmation impossible, réessayez dans un instant.')); return; }
      DETAIL_D.confirmed_at = new Date().toISOString(); DETAIL_D.signed_name = nm; DETAIL_D.signature = sg;
      cb.className = 'cv-main cv-done'; cb.textContent = 'Séance confirmée';
      var alt = root.querySelector('.cv-alt'); if(alt) alt.remove();
      var sgBox = root.querySelector('.cv-sign'); if(sgBox) sgBox.remove();
      var mh = root.querySelector('.cv-miss'); if(mh) mh.remove();
      if(ackCb){ ackCb.disabled = true; }
      if(accBlk && nm) accBlk.insertAdjacentHTML('beforeend', signedHTML(nm, sg, DETAIL_D.confirmed_at));
    }, function(){ cb.disabled = false; });
  };

  var propGo = document.getElementById('cv-prop-go');
  if(propGo) propGo.onclick = function(){
    var dt = document.getElementById('cv-prop-date').value, tm = document.getElementById('cv-prop-time').value, nt = document.getElementById('cv-prop-note').value.trim();
    if(!dt){ alert(tv('Choisis une date', 'Choisissez une date')); return; }
    propGo.disabled = true;
    sb.rpc('propose_shared_date', {p_token:DETAIL_TOK, p_date:dt, p_time:tm || null, p_note:nt || null}).then(function(r){
      if(r.error || !r.data){ propGo.disabled = false; alert(tv('Envoi impossible, réessaie.', 'Envoi impossible, réessayez.')); return; }
      try{ localStorage.setItem('6fltc_proposed_' + DETAIL_TOK, dt); }catch(ex){}
      renderDetail();
    }, function(){ propGo.disabled = false; });
  };

  var starWrap = document.getElementById('cv-stars'), reviewGo = document.getElementById('cv-review-go'), curStars = 0;
  if(starWrap) starWrap.querySelectorAll('.cv-star').forEach(function(btn){
    btn.addEventListener('click', function(){
      curStars = +btn.getAttribute('data-n');
      starWrap.querySelectorAll('.cv-star').forEach(function(s){ s.classList.toggle('on', +s.getAttribute('data-n') <= curStars); });
      if(reviewGo) reviewGo.disabled = false;
    });
  });
  if(reviewGo) reviewGo.onclick = function(){
    if(!curStars){ return; }
    reviewGo.disabled = true;
    var txt = document.getElementById('cv-review-text').value.trim();
    sb.rpc('submit_shared_review', {p_token:DETAIL_TOK, p_rating:curStars, p_text:txt || null}).then(function(r){
      if(r.error || !r.data){ reviewGo.disabled = false; alert(tv('Envoi impossible, réessaie.', 'Envoi impossible, réessayez.')); return; }
      DETAIL_D.review_submitted_at = new Date().toISOString(); DETAIL_D.review_rating = curStars;
      renderDetail();
    }, function(){ reviewGo.disabled = false; });
  };

  clearInterval(DETAIL_TICK);
  if(!rev && D.reveal_at && new Date(D.reveal_at).getFullYear()<2900){
    var upd = function(){
      var ms = new Date(D.reveal_at) - Date.now(), el = document.getElementById('cv-count');
      if(ms <= 0){ clearInterval(DETAIL_TICK); loadDetail(); return; }
      var dd = Math.floor(ms/864e5), hh = Math.floor(ms%864e5/36e5), mm = Math.floor(ms%36e5/6e4);
      if(el) el.textContent = (dd ? dd+' j ' : '')+hh+' h '+(mm<10?'0':'')+mm+' min';
    };
    upd(); DETAIL_TICK = setInterval(upd, 20000);
  }
}

/* ===== export PDF (repris tel quel du moteur Spoties, meme rendu) ===== */
var PDF_LIBS = null;
function loadScript(src){ return new Promise(function(res, rej){ var sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); }
function loadPdfLibs(){
  if(window.html2canvas && window.jspdf) return Promise.resolve();
  if(!PDF_LIBS) PDF_LIBS = Promise.all([
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
  ]).catch(function(err){ PDF_LIBS = null; throw err; });
  return PDF_LIBS;
}
function imgToData(im){
  var src = im.getAttribute('src') || '';
  if(!src || src.indexOf('data:')===0) return Promise.resolve();
  return fetch(src, {mode:'cors', cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(function(b){
    return new Promise(function(res){ var fr = new FileReader(); fr.onload = function(){ im.src = fr.result; im.complete ? res() : (im.onload = im.onerror = res); }; fr.onerror = res; fr.readAsDataURL(b); });
  }).catch(function(){});
}
function pdfCapture(cl){
  var imgs = Array.prototype.slice.call(cl.querySelectorAll('img'));
  return Promise.race([
    Promise.all(imgs.map(imgToData)),
    new Promise(function(r){ setTimeout(r, 8000); })
  ]).then(function(){ return (document.fonts && document.fonts.ready) || 0; }).then(function(){
    var scale = 2, top0 = cl.getBoundingClientRect().top;
    var cuts = Array.prototype.slice.call(cl.querySelectorAll('.bf-row')).map(function(r){ var b = r.getBoundingClientRect(); return {t:(b.top-top0)*scale, b:(b.bottom-top0)*scale}; });
    return html2canvas(cl, {scale:scale, useCORS:true, backgroundColor:'#ffffff', logging:false, windowWidth:720, scrollX:0, scrollY:-window.scrollY}).then(function(cv){ return {cv:cv, cuts:cuts}; });
  });
}
function pdfWrite(o, title, file){
  var cv = o.cv, cuts = o.cuts;
  var J = window.jspdf.jsPDF, pdf = new J({unit:'mm', format:'a4', orientation:'portrait', compress:true});
  var mX = 12, mT = 12, mB = 14, wMM = 210 - mX*2, hMM = 297 - mT - mB;
  var pxPerMM = cv.width / wMM, pageH = Math.floor(hMM * pxPerMM);
  var y = 0, first = true, ctx = cv.getContext('2d');
  var gaps = [];
  for(var gi=0; gi<cuts.length-1; gi++){ if(cuts[gi+1].t > cuts[gi].b) gaps.push((cuts[gi].b + cuts[gi+1].t)/2); }
  function blankCut(lo, hi){
    lo = Math.max(0, Math.floor(lo)); hi = Math.min(cv.height, Math.floor(hi)); if(hi - lo < 12) return 0;
    var w = cv.width, data = ctx.getImageData(0, lo, w, hi - lo).data, run = 0, need = 10;
    for(var r = hi - lo - 1; r >= 0; r--){
      var o2 = r*w*4, edges = 0;
      for(var x = 4; x < w*4; x += 8){
        if(Math.abs(data[o2+x]-data[o2+x-4]) + Math.abs(data[o2+x+1]-data[o2+x-3]) + Math.abs(data[o2+x+2]-data[o2+x-2]) > 60){ if(++edges > 8) break; }
      }
      if(edges <= 8){ if(++run >= need) return lo + r + Math.floor(need/2); } else run = 0;
    }
    return 0;
  }
  while(y < cv.height - 2){
    var lim = y + pageH, end;
    if(lim >= cv.height) end = cv.height;
    else {
      var g1 = gaps.filter(function(g){ return g > y + pageH*0.4 && g <= lim - 2; }).pop();
      end = g1 || blankCut(y + pageH*0.4, lim - 2) || gaps.filter(function(g){ return g > y + pageH*0.15 && g <= lim - 2; }).pop() || blankCut(y + pageH*0.1, y + pageH*0.4) || lim;
      end = Math.round(end);
    }
    var hh = Math.max(1, Math.round(end - y));
    var pc = document.createElement('canvas'); pc.width = cv.width; pc.height = hh;
    var g = pc.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, pc.width, hh); g.drawImage(cv, 0, y, cv.width, hh, 0, 0, cv.width, hh);
    if(!first) pdf.addPage(); first = false;
    pdf.addImage(pc.toDataURL('image/jpeg', 0.92), 'JPEG', mX, mT, wMM, hh / pxPerMM);
    y = end;
  }
  pdf.setProperties({title:title, author:'6flt Photographies'});
  pdf.save(file);
}
function bfHtmlPdf(html, o){
  o = o || {};
  var host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:0;top:0;width:720px;z-index:-1;background:#fff;pointer-events:none';
  document.body.appendChild(host);
  return loadPdfLibs().then(function(){
    var cl = document.createElement('div');
    cl.className = 'bf-doc bf-print bf-m-a4';
    if(o.car) cl.style.setProperty('--car', o.car);
    if(o.accent) cl.style.setProperty('--d-accent', o.accent);
    cl.innerHTML = html || '';
    cl.querySelectorAll('.cv-gl').forEach(function(x){ x.remove(); });
    host.appendChild(cl);
    cl.style.cssText += ';border:none;box-shadow:none;border-radius:0;padding:0;width:720px';
    return pdfCapture(cl);
  }).then(function(r){
    pdfWrite(r, o.title || 'Briefing', o.file || 'Briefing 6flt.pdf');
    host.remove();
  }, function(err){ host.remove(); throw err; });
}

/* ===== demarrage (v1.2) ===== */
(function start(){
  var toks = urlTokens();
  if(isStandalone()){
    // app installee : les seances du lien d'installation sont importees une seule fois,
    // pour qu'une seance retiree de la liste ne revienne pas a chaque lancement
    var imported = loadJSON('6fltc_imported', []), fresh = [];
    if(!Array.isArray(imported)) imported = [];
    toks.forEach(function(t){
      if(imported.indexOf(t) > -1) return;
      imported.push(t);
      if(!loadTokens().some(function(x){ return x.token===t; })){ addTokenToStore(t); fresh.push(t); }
    });
    saveJSON('6fltc_imported', imported);
    if(toks.length){ try{ history.replaceState(null, '', location.pathname); }catch(ex){} }
    renderList();
    fresh.forEach(registerTokenForExistingPush);
    if(fresh.length===1) openDetail(fresh[0]);
    return;
  }
  // navigateur : le lien ouvre la seance, la liste et l'adresse gardent toutes les seances
  toks.forEach(addTokenToStore);
  syncUrl();
  renderList();
  if(toks.length===1) openDetail(toks[0]);
})();
